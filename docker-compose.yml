services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "54322:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  api:
    build: ./backend
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      # - redis  # P2 only: uncomment when Celery is introduced
  # redis:  # P2 only
  #   image: redis:7-alpine
  #   ports:
  #     - "6379:6379"
volumes:
  pgdata:
